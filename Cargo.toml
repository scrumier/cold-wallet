[workspace]
members = [
    "wallet-core",
    "wallet-sim",
]
resolver = "3"

[workspace.dependencies]
embedded-graphics = "0.8.1"

# Cryptography — all no_std compatible
k256            = { version = "0.13.4", default-features = false, features = ["ecdsa"] }
bip32           = { version = "0.5.3",  default-features = false, features = ["secp256k1"] }
bip39           = { version = "2.2.2",  default-features = false }
bitcoin_hashes  = { version = "0.20.0", default-features = false }

# QR — disable std for no_std builds
qrcode          = { version = "0.14.1", default-features = false }